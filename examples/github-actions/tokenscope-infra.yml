# TokenScope infrastructure (Bicep) — example workflow.
# Copy to .github/workflows/ in your fork. Setup: examples/github-actions/README.md.
#
# Applies infra/main.bicep with your committed parameter file. The parameter
# file reads every secret from environment variables (readEnvironmentVariable),
# so this workflow maps the GitHub environment's secrets onto those names.
name: TokenScope infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding this deployment's secrets and variables
        required: true
        default: sandbox
      mode:
        description: what-if previews only; apply deploys
        type: choice
        options: [what-if, apply]
        default: what-if
      params:
        description: Parameter file; empty = the environment's TOKENSCOPE_PARAMS
        required: false
        default: ''
  # Lets another workflow run this one (a pipeline, or a validation run).
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      mode:
        type: string
        default: what-if
      params:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

# Shared with the deploy workflow: an apply resets the app to `latest`, so the
# two must not overlap.
concurrency:
  group: tokenscope-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PARAMS: ${{ inputs.params || vars.TOKENSCOPE_PARAMS }}
      # Required by the example parameter files.
      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}
      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      # Optional provider credentials; unset = not configured.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT_1: ${{ secrets.GH_PAT_1 }}
      GH_PAT_2: ${{ secrets.GH_PAT_2 }}
      GH_PAT_3: ${{ secrets.GH_PAT_3 }}
      GH_APP_KEY_1: ${{ secrets.GH_APP_KEY_1 }}
      # DEPRECATED: the earlier named GitHub secrets, still passed for now so a
      # deployment that set them keeps working (CHANGELOG.md has the upgrade note).
      GH_PAT_PARTNER_DEMO: ${{ secrets.GH_PAT_PARTNER_DEMO }}
      GH_PAT_PRODUCTION: ${{ secrets.GH_PAT_PRODUCTION }}
      GH_PAT_ENTERPRISE_NFR: ${{ secrets.GH_PAT_ENTERPRISE_NFR }}
      GH_APP_KEY_PARTNER_DEMO: ${{ secrets.GH_APP_KEY_PARTNER_DEMO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          for v in RG PARAMS PG_ADMIN_LOGIN PG_ADMIN_PASSWORD SESSION_SECRET HMAC_SESSION_KEY \
                   INTERNAL_WORKER_HMAC_KEY OIDC_SESSION_SECRET OIDC_AUTH_SESSION_SECRET \
                   OIDC_TOKEN_KEY ENTRA_CLIENT_SECRET; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the '$ENVIRONMENT' environment:$missing"
            exit 1
          fi
          [ -f "$PARAMS" ] || { echo "::error::Parameter file $PARAMS is not in the repository"; exit 1; }

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compile parameters
        run: az bicep build-params --file "$PARAMS" --stdout > /dev/null

      - name: What-if
        run: |
          az deployment group what-if --resource-group "$RG" \
            --template-file infra/main.bicep --parameters "$PARAMS" \
            --result-format ResourceIdOnly

      - name: Apply
        id: apply1
        if: inputs.mode == 'apply'
        # Started without waiting so the script below can approve Front Door
        # Premium's Private Link request while the apply runs: the Front Door
        # origin does not finish until it is approved. For any other posture
        # the script just waits for the deployment and reports its result.
        # Exit 4 from the script means only Azure's platform failed (an
        # InternalError, a timeout, a conflict) or Front Door is not routing
        # yet: the template is idempotent, so the apply runs again, up to two
        # more times, each after a fresh sign-in (one lasts about an hour).
        run: |
          az deployment group create --resource-group "$RG" \
            --template-file infra/main.bicep --parameters "$PARAMS" --no-wait
          rc=0
          # A retry may approve the one Private Link request Front Door filed
          # during the attempt before (the script records it there on exit 4).
          export APPROVE_CARRY="$RUNNER_TEMP/tokenscope-fd-pending"
          bash infra/scripts/approve-front-door-private-link.sh "$RG" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::First apply: the Container App waits for its image. Run TokenScope deploy, then apply again to create what depends on the app (alerts, worker jobs, Front Door)."
            exit 0
          fi
          if [ "$rc" = 4 ]; then
            echo "retry=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::Apply attempt 1 hit an Azure platform error or Front Door was not routing yet (see above); retrying after a fresh sign-in."
            echo "- Apply attempt 1: Azure platform error or Front Door not routing yet; retried." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "::notice::containerAppUrl = $(az deployment group show -g "$RG" -n main \
            --query properties.outputs.containerAppUrl.value -o tsv)"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.apply1.outputs.retry == 'yes'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply again (retry 1 of 2)
        id: apply2
        if: steps.apply1.outputs.retry == 'yes'
        run: |
          sleep 60
          az deployment group create --resource-group "$RG" \
            --template-file infra/main.bicep --parameters "$PARAMS" --no-wait
          rc=0
          # A retry may approve the one Private Link request Front Door filed
          # during the attempt before (the script records it there on exit 4).
          export APPROVE_CARRY="$RUNNER_TEMP/tokenscope-fd-pending"
          # Shorter waits on a retry keep all three attempts inside the hosted
          # job's six hours (90 + 2 x 50 minutes, plus Front Door's 45).
          export APPROVE_TIMEOUT_MIN=50
          bash infra/scripts/approve-front-door-private-link.sh "$RG" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::First apply: the Container App waits for its image. Run TokenScope deploy, then apply again to create what depends on the app (alerts, worker jobs, Front Door)."
            exit 0
          fi
          if [ "$rc" = 4 ]; then
            echo "retry=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::Apply attempt 2 hit an Azure platform error or Front Door was not routing yet (see above); retrying after a fresh sign-in."
            echo "- Apply attempt 2: Azure platform error or Front Door not routing yet; retried." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "::notice::The apply passed after 1 retry."
          echo "- The apply passed after 1 retry." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::containerAppUrl = $(az deployment group show -g "$RG" -n main \
            --query properties.outputs.containerAppUrl.value -o tsv)"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.apply2.outputs.retry == 'yes'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply again (retry 2 of 2)
        id: apply3
        if: steps.apply2.outputs.retry == 'yes'
        run: |
          sleep 60
          az deployment group create --resource-group "$RG" \
            --template-file infra/main.bicep --parameters "$PARAMS" --no-wait
          rc=0
          # A retry may approve the one Private Link request Front Door filed
          # during the attempt before (the script records it there on exit 4).
          export APPROVE_CARRY="$RUNNER_TEMP/tokenscope-fd-pending"
          # Shorter waits on a retry keep all three attempts inside the hosted
          # job's six hours (90 + 2 x 50 minutes, plus Front Door's 45).
          export APPROVE_TIMEOUT_MIN=50
          bash infra/scripts/approve-front-door-private-link.sh "$RG" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::First apply: the Container App waits for its image. Run TokenScope deploy, then apply again to create what depends on the app (alerts, worker jobs, Front Door)."
            exit 0
          fi
          if [ "$rc" = 4 ]; then
            echo "::error::The apply still failed on Azure's side after 2 retries (see above)."
            exit 4
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "::notice::The apply passed after 2 retries."
          echo "- The apply passed after 2 retries." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::containerAppUrl = $(az deployment group show -g "$RG" -n main \
            --query properties.outputs.containerAppUrl.value -o tsv)"
