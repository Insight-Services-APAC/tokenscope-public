<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">TokenScope at a glance: telemetry says whose work it was, the provider APIs say how much, and TokenScope reconciles the two</title>
  <desc id="d">Developer devices send usage events to Azure Monitor and talk to TokenScope over MCP to enrol and tag sessions. TokenScope reads the events back, pulls complete daily usage and bills from the Anthropic and GitHub APIs, reconciles the two in PostgreSQL, and serves the dashboard.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="300"/>
  <rect class="zone" x="16" y="16" width="204" height="268" rx="10"/>
  <text class="zlabel" x="30" y="38">DEVELOPERS · PROVIDERS</text>
  <rect class="zone" x="240" y="16" width="524" height="268" rx="10"/>
  <text class="zlabel" x="254" y="38">AZURE</text>
  <rect class="zone" x="784" y="16" width="200" height="268" rx="10"/>
  <text class="zlabel" x="798" y="38">READERS</text>
  <rect class="node" x="32" y="52" width="172" height="64" rx="6"/>
  <text class="t" x="118" y="71.5" text-anchor="middle">Developer devices</text>
  <text class="s" x="118" y="88.5" text-anchor="middle">Claude Code · Copilot CLI</text>
  <text class="s" x="118" y="105.5" text-anchor="middle">TokenScope plugin</text>
  <rect class="node" x="32" y="200" width="172" height="64" rx="6"/>
  <text class="t" x="118" y="219.5" text-anchor="middle">Provider APIs</text>
  <text class="s" x="118" y="236.5" text-anchor="middle">Anthropic Analytics</text>
  <text class="s" x="118" y="253.5" text-anchor="middle">GitHub Copilot</text>
  <rect class="node" x="262" y="52" width="200" height="64" rx="6"/>
  <text class="t" x="362" y="80" text-anchor="middle">Azure Monitor</text>
  <text class="s" x="362" y="97" text-anchor="middle">OTelLogs table</text>
  <rect class="node acc" x="516" y="104" width="228" height="128" rx="6"/>
  <text class="t" x="630" y="138.5" text-anchor="middle">TokenScope</text>
  <text class="s" x="630" y="155.5" text-anchor="middle">web app + scheduled workers</text>
  <text class="s" x="630" y="172.5" text-anchor="middle">PostgreSQL</text>
  <text class="s acc" x="630" y="189.5" text-anchor="middle">reconciles telemetry against</text>
  <text class="s acc" x="630" y="206.5" text-anchor="middle">provider usage per teammate · day</text>
  <rect class="node" x="800" y="104" width="168" height="128" rx="6"/>
  <text class="t" x="884" y="147" text-anchor="middle">Dashboard</text>
  <text class="s" x="884" y="164" text-anchor="middle">budgets · rollups</text>
  <text class="s" x="884" y="181" text-anchor="middle">untagged worklist</text>
  <text class="s" x="884" y="198" text-anchor="middle">chargeback</text>
  <polyline class="e" points="204,84 256,84" marker-end="url(#ah)"/>
  <circle class="cn" cx="230" cy="84" r="10"/><text class="cnt" x="230" y="88" text-anchor="middle">1</text>
  <polyline class="e" points="462,84 630,84 630,98" marker-end="url(#ah)"/>
  <circle class="cn" cx="546" cy="84" r="10"/><text class="cnt" x="546" y="88" text-anchor="middle">2</text>
  <polyline class="e dashed" points="118,116 118,150 510,150" marker-end="url(#ah)"/>
  <circle class="cn" cx="470" cy="150" r="10"/><text class="cnt" x="470" y="154" text-anchor="middle">3</text>
  <text class="lbl" x="240" y="142">MCP: enrol · tag sessions</text>
  <polyline class="e" points="204,232 510,232" marker-end="url(#ah)"/>
  <circle class="cn" cx="470" cy="232" r="10"/><text class="cnt" x="470" y="236" text-anchor="middle">4</text>
  <text class="lbl" x="240" y="224">complete daily usage · bills</text>
  <polyline class="e" points="744,168 794,168" marker-end="url(#ah)"/>
  <circle class="cn" cx="769" cy="168" r="10"/><text class="cnt" x="769" y="172" text-anchor="middle">5</text>
</svg>
