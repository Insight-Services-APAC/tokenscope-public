  <line class="e" x1="748" y1="251" x2="756" y2="251"/>
  <line class="e" x1="748" y1="307" x2="756" y2="307"/>
  <line class="e" x1="756" y1="83" x2="756" y2="406"/>
  <polyline class="e" points="756,406 756,412 754,412" marker-end="url(#ah)"/>
  <rect class="node acc" x="426" y="470" width="156" height="116" rx="6"/>
  <text class="tm" x="440" y="490">heartbeat-coverage</text>
  <text class="s" x="440" y="508">Claude Code only: no</text>
  <text class="s" x="440" y="524">covering /bearer</text>
  <text class="s" x="440" y="540">heartbeat → unverified</text>
  <text class="s" x="440" y="556">spend; never revokes</text>
  <rect class="node acc" x="588" y="470" width="160" height="116" rx="6"/>
  <text class="tm" x="600" y="490">usage-reconciliation</text>
  <text class="s" x="600" y="508">compares OTel with the</text>
  <text class="s" x="600" y="524">provider APIs per day;</text>
  <text class="s" x="600" y="540">flags OTel the bill</text>
  <text class="s" x="600" y="556">does not corroborate</text>
  <line class="e accent" x1="504" y1="470" x2="504" y2="450" marker-end="url(#ah-acc)"/>
  <line class="e accent" x1="668" y1="470" x2="668" y2="450" marker-end="url(#ah-acc)"/>
  <rect class="node acc" x="796" y="400" width="172" height="56" rx="6"/>
  <text class="tm" x="810" y="420">log-&lt;name&gt;</text>
  <text class="s" x="810" y="437">OTelLogs · anyone with</text>
  <text class="s" x="810" y="451">an emit token can write</text>
  <rect class="node" x="796" y="566" width="172" height="44" rx="6"/>
  <text class="t" x="882" y="585" text-anchor="middle">DCE + DCR</text>
  <text class="s" x="882" y="601" text-anchor="middle">public OTLP ingest</text>
