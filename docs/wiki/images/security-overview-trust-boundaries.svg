  <line class="e accent" x1="796" y1="434" x2="754" y2="434" marker-end="url(#ah-acc)"/>
  <line class="e" x1="184" y1="91" x2="218" y2="91" marker-end="url(#ah)"/>
  <line class="e" x1="330" y1="83" x2="366" y2="83" marker-end="url(#ah)"/>
  <line class="e" x1="184" y1="238" x2="218" y2="238" marker-end="url(#ah)"/>
  <line class="e" x1="330" y1="139" x2="366" y2="139" marker-end="url(#ah)"/>
  <line class="e" x1="330" y1="195" x2="366" y2="195" marker-end="url(#ah)"/>
  <line class="e" x1="330" y1="251" x2="366" y2="251" marker-end="url(#ah)"/>
  <polyline class="e accent" points="106,276 106,644 882,644 882,616" marker-end="url(#ah-acc)"/>
  <text class="lbl" x="480" y="636" text-anchor="middle">OTLP with the minted bearer, never through the app</text>
