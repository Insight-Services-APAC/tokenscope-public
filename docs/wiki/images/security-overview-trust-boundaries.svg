<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="t d">
  <title id="t">Every caller that reaches the app passes its own check at its own route; usage telemetry never passes the app&#x27;s door, so it is defended after it lands.</title>
  <desc id="d">Browsers sign in with Entra OIDC. The CLI plugin uses OAuth 2.1 for MCP, redeems a one-time handoff code for its emit credential, and trades that credential for an Azure Monitor bearer. Cron jobs call the run-worker route with an HMAC signature. All of them pass Front Door and its X-Azure-FDID gate when frontDoorId is set. Telemetry goes from the device straight to the public Azure Monitor ingest endpoint, so anyone holding an emit token can write rows. The read joiner gates projects by membership as it reads, heartbeat-coverage quarantines Claude Code sessions with no covering bearer heartbeat, and usage-reconciliation flags OTel the provider bill does not corroborate.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="690"/>
  <rect class="zone" x="16" y="16" width="180" height="658" rx="10"/>
  <text class="zlabel" x="30" y="38">DEVELOPER · UNTRUSTED</text>
  <rect class="zone" x="212" y="16" width="130" height="330" rx="10"/>
  <text class="zlabel" x="226" y="38">PUBLIC EDGE</text>
  <rect class="zone" x="358" y="16" width="406" height="596" rx="10"/>
  <text class="zlabel" x="372" y="38">VNET · INTERNAL INGRESS</text>
  <rect class="zone" x="780" y="356" width="204" height="318" rx="10"/>
  <text class="zlabel" x="794" y="378">AZURE MONITOR</text>
  <rect class="node" x="28" y="60" width="156" height="62" rx="6"/>
  <text class="t" x="106" y="82" text-anchor="middle">Browser</text>
  <text class="s" x="106" y="99" text-anchor="middle">four assignable roles</text>
  <text class="s" x="106" y="114" text-anchor="middle">Entra sign-in</text>
  <rect class="node" x="28" y="200" width="156" height="76" rx="6"/>
  <text class="t" x="106" y="222" text-anchor="middle">CLI + plugin</text>
  <text class="s" x="106" y="239" text-anchor="middle">Claude Code · Copilot</text>
  <text class="s" x="106" y="255" text-anchor="middle">holds an emit token</text>
  <text class="s" x="106" y="270" text-anchor="middle">on disk</text>
  <rect class="node" x="224" y="60" width="106" height="270" rx="6"/>
  <text class="t" x="277" y="82" text-anchor="middle">Front Door</text>
  <text class="s" x="277" y="99" text-anchor="middle">Premium</text>
  <text class="s" x="277" y="114" text-anchor="middle">or your WAF</text>
  <rect class="node" x="372" y="60" width="38" height="270" rx="6"/>
  <text class="tm" x="0" y="0" text-anchor="middle" transform="translate(395,195) rotate(-90)">require-front-door · X-Azure-FDID</text>
  <rect class="node" x="426" y="60" width="322" height="46" rx="6"/>
  <text class="t" x="440" y="79">Entra OIDC cookie</text>
  <text class="s" x="440" y="96">DB enrichment · requireRole · region scope</text>
  <line class="e" x1="410" y1="83" x2="420" y2="83" marker-end="url(#ah)"/>
  <rect class="node" x="426" y="116" width="322" height="46" rx="6"/>
  <text class="tm" x="440" y="135">/api/v1/mcp · /api/v1/oauth/*</text>
  <text class="s" x="440" y="152">OAuth 2.1 with PKCE · read and tag scopes</text>
  <line class="e" x1="410" y1="139" x2="420" y2="139" marker-end="url(#ah)"/>
  <rect class="node" x="426" y="172" width="322" height="46" rx="6"/>
  <text class="tm" x="440" y="191">/api/v1/setup/redeem</text>
  <text class="s" x="440" y="208">a one-time handoff code is the credential</text>
  <line class="e" x1="410" y1="195" x2="420" y2="195" marker-end="url(#ah)"/>
  <rect class="node" x="426" y="228" width="322" height="46" rx="6"/>
  <text class="tm" x="440" y="247">/api/v1/instances/{id}/bearer</text>
  <text class="s" x="440" y="264">emit token in, Azure Monitor bearer out</text>
  <line class="e" x1="410" y1="251" x2="420" y2="251" marker-end="url(#ah)"/>
  <rect class="node" x="426" y="284" width="322" height="46" rx="6"/>
  <text class="tm" x="440" y="303">/api/v1/internal/run-worker/{name}</text>
  <text class="s" x="440" y="320">HMAC-SHA256 · ±300 s · identical 401s</text>
  <line class="e" x1="410" y1="307" x2="420" y2="307" marker-end="url(#ah)"/>
  <rect class="node" x="426" y="344" width="214" height="40" rx="6"/>
  <text class="tm" x="440" y="361">caj-ts-* · 32 cron jobs</text>
  <text class="s" x="440" y="377">call workerBaseUrl</text>
  <polyline class="e" points="426,364 391,364 391,336" marker-end="url(#ah)"/>
  <rect class="node private" x="426" y="400" width="322" height="44" rx="6"/>
  <text class="tm" x="440" y="418">pg-&lt;name&gt;</text>
  <text class="s priv" x="440" y="435">private endpoint · scoped per request</text>
  <line class="e" x1="748" y1="83" x2="756" y2="83"/>
  <line class="e" x1="748" y1="139" x2="756" y2="139"/>
