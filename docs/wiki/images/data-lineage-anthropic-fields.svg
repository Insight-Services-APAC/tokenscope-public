<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d">
  <title id="t">actual_spend keeps three summed numbers per teammate, day and tool; every other dimension of the Anthropic reports reaches provider_usage_fact only through actual_spend.raw_payload.</title>
  <desc id="d">Field lineage from the Anthropic user_usage_report and user_cost_report. analytics-poll binds each row to a teammate by actor email, queues unbound rows to pending_placement, skips web_search and code_execution cost rows, and writes actual_spend with summed input tokens, output tokens and cost plus the verbatim rows as raw_payload. provider-transform reads raw_payload hourly and writes provider_usage_fact with model, cache lanes, requests, web searches, context window, cost type and currency. total_tokens, list_amount, token_type, actor.user_id and data_refreshed_at are parsed and never stored.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="580"/>
  <style>.struck { text-decoration: line-through; }</style>
  <rect class="zone" x="16" y="16" width="310" height="508" rx="10"/>
  <text class="zlabel" x="30" y="38">ANTHROPIC ANALYTICS API</text>
  <rect class="zone" x="346" y="16" width="250" height="508" rx="10"/>
  <text class="zlabel" x="360" y="38">WORKERS</text>
  <rect class="zone" x="616" y="16" width="368" height="508" rx="10"/>
  <text class="zlabel" x="630" y="38">POSTGRES</text>

  <!-- usage report -->
  <rect class="node" x="36" y="56" width="270" height="234" rx="6"/>
  <text class="tm" x="50" y="78">user_usage_report</text>
  <text class="s" x="50" y="95">per actor · product · model · day</text>
  <text class="sm" x="50" y="120">uncached_input_tokens</text><text class="s" x="296" y="120" text-anchor="end">Σ</text>
  <text class="sm" x="50" y="137">output_tokens</text><text class="s" x="296" y="137" text-anchor="end">Σ</text>
  <text class="sm acc" x="50" y="154">cache_creation.*</text>
  <text class="sm acc" x="50" y="171">cache_read_input_tokens</text>
  <text class="sm acc" x="50" y="188">requests</text>
  <text class="sm acc" x="50" y="205">server_tool_use.web_search_requests</text>
  <text class="sm acc" x="50" y="222">context_window</text>
  <text class="sm acc" x="50" y="239">model</text>
  <text class="sm struck" x="50" y="256">total_tokens</text>
  <text class="sm struck" x="50" y="273">data_refreshed_at</text><text class="s" x="296" y="273" text-anchor="end">envelope</text>

  <!-- cost report -->
  <rect class="node" x="36" y="306" width="270" height="200" rx="6"/>
  <text class="tm" x="50" y="328">user_cost_report</text>
  <text class="s" x="50" y="345">per actor · product · cost_type · model</text>
  <text class="sm" x="50" y="370">amount</text><text class="s" x="296" y="370" text-anchor="end">cents string, Σ</text>
  <text class="sm" x="50" y="387">cost_type</text><text class="s" x="296" y="387" text-anchor="end">filter</text>
  <text class="sm acc" x="50" y="404">cost_type · model · currency</text>
  <text class="sm struck" x="50" y="421">list_amount</text>
  <text class="sm struck" x="50" y="438">token_type</text>
  <text class="sm struck" x="50" y="455">actor.user_id</text>
  <text class="s bad" x="50" y="486">web_search · code_execution rows</text>

  <!-- workers -->
  <rect class="node" x="366" y="150" width="210" height="76" rx="6"/>
  <text class="tm" x="471" y="172" text-anchor="middle">analytics-poll</text>
  <text class="s" x="471" y="190" text-anchor="middle">every 15 min · 30-day re-poll</text>
  <text class="s" x="471" y="210" text-anchor="middle">actor.email → teammate</text>
  <rect class="node" x="366" y="330" width="210" height="60" rx="6"/>
  <text class="tm" x="471" y="353" text-anchor="middle">provider-transform</text>
  <text class="s" x="471" y="371" text-anchor="middle">hourly · same 30-day window</text>

  <!-- tables -->
  <rect class="node" x="636" y="52" width="328" height="46" rx="6"/>
  <text class="tm" x="650" y="71">pending_placement</text>
  <text class="s" x="650" y="88">unbound email · placement-sync replays it</text>
  <rect class="node" x="636" y="120" width="328" height="96" rx="6"/>
  <text class="tm" x="650" y="142">actual_spend</text>
  <text class="s" x="650" y="160">input_tokens · output_tokens · cost_usd</text>
  <text class="s" x="650" y="177">one row per teammate · day · tool</text>
  <text class="sm acc" x="650" y="202">raw_payload = { day, usage[], cost[] }</text>
  <rect class="node acc" x="636" y="314" width="328" height="96" rx="6"/>
  <text class="tm" x="650" y="336">provider_usage_fact</text>
  <text class="s" x="650" y="354">token row: four token lanes · requests</text>
  <text class="s" x="650" y="370">· web_search_requests</text>
  <text class="s" x="650" y="386">cost row: cost_usd · cost_type · currency</text>
  <text class="s" x="650" y="402">both: model · context_window</text>

  <!-- 1 reports in -->
  <line class="e" x1="306" y1="172" x2="360" y2="172" marker-end="url(#ah)"/>
  <polyline class="e" points="306,380 336,380 336,212 360,212" marker-end="url(#ah)"/>
  <circle class="cn" cx="336" cy="300" r="10"/><text class="cnt" x="336" y="304" text-anchor="middle">1</text>
  <!-- 2 write actual_spend -->
  <line class="e" x1="576" y1="176" x2="630" y2="176" marker-end="url(#ah)"/>
  <circle class="cn" cx="604" cy="176" r="10"/><text class="cnt" x="604" y="180" text-anchor="middle">2</text>
  <!-- 3 owed -->
  <polyline class="e" points="540,150 540,75 630,75" marker-end="url(#ah)"/>
  <circle class="cn" cx="540" cy="110" r="10"/><text class="cnt" x="540" y="114" text-anchor="middle">3</text>
  <!-- 4 raw_payload carry -->
  <polyline class="e accent" points="760,216 760,262 471,262 471,324" marker-end="url(#ah-acc)"/>
  <circle class="cn accent" cx="616" cy="262" r="10"/><text class="cnt accent" x="616" y="266" text-anchor="middle">4</text>
  <!-- 5 facts -->
  <line class="e accent" x1="576" y1="360" x2="630" y2="360" marker-end="url(#ah-acc)"/>
  <circle class="cn accent" cx="604" cy="360" r="10"/><text class="cnt accent" x="604" y="364" text-anchor="middle">5</text>
  <!-- 6 org-grain cost rows skipped -->
  <line class="e bad" x1="306" y1="482" x2="440" y2="482"/>
  <line class="x" x1="391" y1="473" x2="409" y2="491"/><line class="x" x1="409" y1="473" x2="391" y2="491"/>
  <circle class="cn bad" cx="350" cy="482" r="10"/><text class="cnt bad" x="350" y="486" text-anchor="middle">6</text>
  <text class="s" x="452" y="478">skipped: never in</text>
  <text class="s" x="452" y="494">raw_payload or a table</text>

  <!-- legend -->
  <text class="sm" x="36" y="556">field</text>
  <text class="s" x="76" y="556">summed into actual_spend</text>
  <text class="sm acc" x="286" y="556">field</text>
  <text class="s" x="326" y="556">reaches provider_usage_fact only through raw_payload</text>
  <text class="sm struck" x="716" y="556">field</text>
  <text class="s" x="756" y="556">raw_payload only, or not stored</text>
</svg>
