<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
  <title id="t">A scheduled worker runs only after the run-worker route verifies the job's HMAC signature, finds the name in the static registry and takes the per-name lock.</title>
  <desc id="d">Lifeline diagram. A Container Apps job signs a request and posts it to /api/v1/internal/run-worker/{name}. The route verifies the signature within a 300 second window and answers 401 on any failure, looks the name up in the registry and answers 404 for an unknown name, then hands off to dispatchWorker, which takes a Postgres advisory lock (409 if held), checks the admin kill switch, records a worker_run row, runs the worker against Postgres and returns worker, duration_ms and result.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="640"/>
  <rect class="node" x="30" y="20" width="180" height="50" rx="6"/>
  <text class="tm" x="120" y="41" text-anchor="middle">caj-ts-&lt;worker&gt;</text>
  <text class="s" x="120" y="58" text-anchor="middle">Container Apps job · cron</text>
  <rect class="node acc" x="250" y="20" width="200" height="50" rx="6"/>
  <text class="t" x="350" y="41" text-anchor="middle">run-worker route</text>
  <text class="s acc" x="350" y="58" text-anchor="middle">verifyInternalRequest</text>
  <rect class="node" x="490" y="20" width="150" height="50" rx="6"/>
  <text class="t" x="565" y="41" text-anchor="middle">Worker registry</text>
  <text class="s" x="565" y="58" text-anchor="middle">33 static entries</text>
  <rect class="node" x="680" y="20" width="160" height="50" rx="6"/>
  <text class="t" x="760" y="41" text-anchor="middle">dispatchWorker</text>
  <text class="s" x="760" y="58" text-anchor="middle">lock · kill switch · run</text>
  <rect class="node" x="870" y="20" width="110" height="50" rx="6"/>
  <text class="t" x="925" y="41" text-anchor="middle">Postgres</text>
  <text class="s" x="925" y="58" text-anchor="middle">worker pool</text>

  <line class="life" x1="120" y1="70" x2="120" y2="620"/>
  <line class="life" x1="350" y1="70" x2="350" y2="620"/>
  <line class="life" x1="565" y1="70" x2="565" y2="620"/>
  <line class="life" x1="760" y1="70" x2="760" y2="620"/>
  <line class="life" x1="925" y1="70" x2="925" y2="620"/>

  <!-- 1 sign -->
  <rect class="act" x="114" y="92" width="12" height="80"/>
  <circle class="cn" cx="96" cy="104" r="10"/><text class="cnt" x="96" y="108" text-anchor="middle">1</text>
  <text class="sm" x="136" y="104">HMAC-SHA-256 over</text>
  <text class="sm" x="136" y="120">ts\nPOST\npath\nsha256(body)</text>
  <!-- 2 post -->
  <line class="e" x1="126" y1="160" x2="344" y2="160" marker-end="url(#ah)"/>
  <circle class="cn" cx="236" cy="160" r="10"/><text class="cnt" x="236" y="164" text-anchor="middle">2</text>
  <text class="lbl" x="236" y="146" text-anchor="middle">POST + X-Internal-Signature</text>
  <!-- 3 verify -->
  <rect class="act" x="344" y="160" width="12" height="80"/>
  <circle class="cn accent" cx="374" cy="184" r="10"/><text class="cnt accent" x="374" y="188" text-anchor="middle">3</text>
  <text class="sm acc" x="392" y="182">|now − ts| ≤ 300 s</text>
  <text class="sm acc" x="392" y="198">timingSafeEqual(sig)</text>
  <line class="e bad" x1="344" y1="226" x2="127" y2="226" marker-end="url(#ah-bad)"/>
  <text class="s bad" x="236" y="218" text-anchor="middle">401 on any failure, same body</text>
  <!-- 4 registry -->
  <line class="e" x1="356" y1="266" x2="559" y2="266" marker-end="url(#ah)"/>
  <circle class="cn" cx="460" cy="266" r="10"/><text class="cnt" x="460" y="270" text-anchor="middle">4</text>
  <text class="lbl" x="460" y="254" text-anchor="middle">getWorker(name)</text>
  <line class="e bad" x1="559" y1="298" x2="127" y2="298" marker-end="url(#ah-bad)"/>
  <text class="s bad" x="460" y="290" text-anchor="middle">404 unknown name, no worker code runs</text>
  <!-- 5 dispatch -->
  <line class="e" x1="356" y1="336" x2="754" y2="336" marker-end="url(#ah)"/>
  <circle class="cn" cx="560" cy="336" r="10"/><text class="cnt" x="560" y="340" text-anchor="middle">5</text>
  <text class="lbl" x="660" y="326" text-anchor="middle">dispatchWorker(db, entry, opts)</text>
  <rect class="act" x="754" y="336" width="12" height="244"/>
  <!-- 6 lock -->
  <line class="e" x1="766" y1="372" x2="919" y2="372" marker-end="url(#ah)"/>
  <circle class="cn" cx="800" cy="372" r="10"/><text class="cnt" x="800" y="376" text-anchor="middle">6</text>
  <text class="lbl" x="874" y="362" text-anchor="middle">lock worker:&lt;name&gt;</text>
  <line class="e dashed" x1="754" y1="404" x2="127" y2="404" marker-end="url(#ah)"/>
  <text class="s" x="440" y="396" text-anchor="middle">409 if held: trigger logs SKIPPED and exits 0</text>
  <!-- 7 kill switch -->
  <line class="e" x1="766" y1="440" x2="919" y2="440" marker-end="url(#ah)"/>
  <circle class="cn" cx="800" cy="440" r="10"/><text class="cnt" x="800" y="444" text-anchor="middle">7</text>
  <text class="lbl" x="874" y="430" text-anchor="middle">worker_enablement</text>
  <!-- 8 run -->
  <line class="e" x1="766" y1="490" x2="919" y2="490" marker-end="url(#ah)"/>
  <circle class="cn" cx="800" cy="490" r="10"/><text class="cnt" x="800" y="494" text-anchor="middle">8</text>
  <text class="lbl" x="874" y="480" text-anchor="middle">worker_run · entry.run(db)</text>
  <rect class="act" x="919" y="490" width="12" height="50"/>
  <line class="e dashed" x1="919" y1="540" x2="772" y2="540" marker-end="url(#ah)"/>
  <text class="lbl" x="845" y="532" text-anchor="middle">result</text>
  <!-- 9 return -->
  <line class="e" x1="754" y1="580" x2="127" y2="580" marker-end="url(#ah)"/>
  <circle class="cn" cx="440" cy="580" r="10"/><text class="cnt" x="440" y="584" text-anchor="middle">9</text>
  <text class="lbl" x="440" y="570" text-anchor="middle">{ worker, duration_ms, result }: trigger exits 0</text>
</svg>
