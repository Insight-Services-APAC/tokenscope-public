<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 850" width="1010" height="850" role="img" aria-labelledby="t d">
  <title id="t">The model only ever sees a five-minute handoff code; the durable emit credential travels between a local helper and the server, outside the chat.</title>
  <desc id="d">Lifelines for the browser, Claude Code, the local plugin helpers, TokenScope and Azure Monitor. Connect once: an unauthenticated MCP call gets 401 with resource metadata, the browser approves the OAuth consent, and the client exchanges the code for read and tag tokens. Provision once per device: the provision_emit tool returns only a single-use handoff code; the local redeem helper posts it to /setup/redeem and receives the emit refresh token and OTel config, writes them to the Claude settings file, and Claude is restarted. Every session: Claude calls the headers helper about every 29 minutes; the helper refreshes its emit access token, calls the bearer route, receives a managed-identity token for Azure Monitor and hands Claude the Authorization header, and Claude sends OTLP log events straight to Azure Monitor.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
    .fr { fill: var(--panel); stroke: var(--fg2); stroke-width: 1; stroke-dasharray: 3 3; }
    .frl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .06em; fill: var(--fg2); }
    .band { stroke: var(--line); stroke-width: 1; }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1010" height="850"/>
  <rect class="node" x="10" y="20" width="170" height="46" rx="6"/>
  <text class="t" x="95" y="40" text-anchor="middle">Browser</text>
  <text class="sm" x="95" y="57" text-anchor="middle">signed-in teammate</text>
  <line class="life" x1="95" y1="66" x2="95" y2="836"/>
  <rect class="node" x="205" y="20" width="170" height="46" rx="6"/>
  <text class="t" x="290" y="40" text-anchor="middle">Claude Code</text>
  <text class="sm" x="290" y="57" text-anchor="middle">MCP client + model</text>
  <line class="life" x1="290" y1="66" x2="290" y2="836"/>
  <rect class="node" x="405" y="20" width="170" height="46" rx="6"/>
  <text class="t" x="490" y="40" text-anchor="middle">Local helpers</text>
  <text class="sm" x="490" y="57" text-anchor="middle">plugin scripts</text>
  <line class="life" x1="490" y1="66" x2="490" y2="836"/>
  <rect class="node" x="615" y="20" width="170" height="46" rx="6"/>
  <text class="t" x="700" y="40" text-anchor="middle">TokenScope</text>
  <text class="sm" x="700" y="57" text-anchor="middle">/api/v1</text>
  <line class="life" x1="700" y1="66" x2="700" y2="836"/>
  <rect class="node" x="820" y="20" width="170" height="46" rx="6"/>
  <text class="t" x="905" y="40" text-anchor="middle">Azure Monitor</text>
  <text class="sm" x="905" y="57" text-anchor="middle">DCE ingest</text>
  <line class="life" x1="905" y1="66" x2="905" y2="836"/>
  <line class="band" x1="16" y1="72" x2="994" y2="72"/>
  <text class="zlabel" x="20" y="90">CONNECT · ONCE</text>
  <line class="e" x1="290" y1="122" x2="698" y2="122" marker-end="url(#ah)"/>
  <text class="lbl halo" x="505" y="107" text-anchor="middle">POST /api/v1/mcp, no token</text>
  <circle class="cn" cx="312" cy="122" r="10"/><text class="cnt" x="312" y="126" text-anchor="middle">1</text>
  <line class="e dashed" x1="700" y1="154" x2="292" y2="154" marker-end="url(#ah)"/>
  <text class="lbl halo" x="485" y="139" text-anchor="middle">401 · WWW-Authenticate resource_metadata</text>
  <circle class="cn" cx="678" cy="154" r="10"/><text class="cnt" x="678" y="158" text-anchor="middle">2</text>
  <line class="e" x1="290" y1="186" x2="97" y2="186" marker-end="url(#ah)"/>
  <text class="lbl halo" x="182" y="171" text-anchor="middle">open /oauth/authorize · PKCE</text>
  <circle class="cn" cx="268" cy="186" r="10"/><text class="cnt" x="268" y="190" text-anchor="middle">3</text>
  <line class="e" x1="95" y1="218" x2="698" y2="218" marker-end="url(#ah)"/>
  <text class="lbl halo" x="408" y="203" text-anchor="middle">Approve: POST /oauth/authorize · Entra cookie, same origin</text>
  <circle class="cn" cx="117" cy="218" r="10"/><text class="cnt" x="117" y="222" text-anchor="middle">4</text>
  <line class="e dashed" x1="95" y1="250" x2="288" y2="250" marker-end="url(#ah)"/>
  <text class="lbl halo" x="202" y="235" text-anchor="middle">callback with code</text>
  <circle class="cn" cx="117" cy="250" r="10"/><text class="cnt" x="117" y="254" text-anchor="middle">5</text>
  <line class="e" x1="290" y1="282" x2="698" y2="282" marker-end="url(#ah)"/>
  <text class="lbl halo" x="505" y="267" text-anchor="middle">POST /oauth/token · code + verifier</text>
  <circle class="cn" cx="312" cy="282" r="10"/><text class="cnt" x="312" y="286" text-anchor="middle">6</text>
  <line class="e dashed" x1="700" y1="314" x2="292" y2="314" marker-end="url(#ah)"/>
  <text class="lbl halo" x="485" y="299" text-anchor="middle">access + refresh token · read, tag</text>
  <circle class="cn" cx="678" cy="314" r="10"/><text class="cnt" x="678" y="318" text-anchor="middle">7</text>
  <line class="band" x1="16" y1="334" x2="994" y2="334"/>
  <text class="zlabel" x="20" y="352">PROVISION · ONCE PER DEVICE</text>
  <line class="e" x1="290" y1="378" x2="698" y2="378" marker-end="url(#ah)"/>
  <text class="lbl halo" x="505" y="363" text-anchor="middle">provision_emit tool · read scope</text>
  <circle class="cn" cx="312" cy="378" r="10"/><text class="cnt" x="312" y="382" text-anchor="middle">8</text>
  <line class="e dashed" x1="700" y1="410" x2="292" y2="410" marker-end="url(#ah)"/>
  <text class="lbl halo" x="485" y="395" text-anchor="middle">handoff code · 5 min · single use</text>
  <circle class="cn" cx="678" cy="410" r="10"/><text class="cnt" x="678" y="414" text-anchor="middle">9</text>
  <line class="e" x1="290" y1="442" x2="488" y2="442" marker-end="url(#ah)"/>
  <text class="lbl halo" x="400" y="427" text-anchor="middle">run claude-redeem.mjs</text>
  <circle class="cn" cx="312" cy="442" r="10"/><text class="cnt" x="312" y="446" text-anchor="middle">10</text>
  <line class="e accent" x1="490" y1="474" x2="698" y2="474" marker-end="url(#ah-acc)"/>
  <text class="s acc halo" x="605" y="459" text-anchor="middle">POST /setup/redeem · code is the auth</text>
  <circle class="cn accent" cx="512" cy="474" r="10"/><text class="cnt accent" x="512" y="478" text-anchor="middle">11</text>
  <line class="e accent dashed" x1="700" y1="506" x2="492" y2="506" marker-end="url(#ah-acc)"/>
  <text class="s acc halo" x="585" y="491" text-anchor="middle">emit refresh token + OTel config</text>
  <circle class="cn accent" cx="678" cy="506" r="10"/><text class="cnt accent" x="678" y="510" text-anchor="middle">12</text>
  <polyline class="e" points="496,522 534,522 534,544 498,544" marker-end="url(#ah)"/>
  <circle class="cn" cx="534" cy="533" r="10"/><text class="cnt" x="534" y="537" text-anchor="middle">13</text>
  <text class="lbl halo" x="552" y="531">write ~/.claude/settings.json</text>
  <text class="lbl halo" x="552" y="545">then restart claude</text>
  <line class="band" x1="16" y1="568" x2="994" y2="568"/>
  <text class="zlabel" x="20" y="586">EMIT · EVERY SESSION</text>
  <line class="e" x1="290" y1="612" x2="488" y2="612" marker-end="url(#ah)"/>
  <text class="lbl halo" x="400" y="597" text-anchor="middle">otelHeadersHelper · ~29 min</text>
  <circle class="cn" cx="312" cy="612" r="10"/><text class="cnt" x="312" y="616" text-anchor="middle">14</text>
  <line class="e" x1="490" y1="644" x2="698" y2="644" marker-end="url(#ah)"/>
  <text class="lbl halo" x="605" y="629" text-anchor="middle">POST /oauth/token · refresh grant</text>
  <circle class="cn" cx="512" cy="644" r="10"/><text class="cnt" x="512" y="648" text-anchor="middle">15</text>
  <line class="e" x1="490" y1="676" x2="698" y2="676" marker-end="url(#ah)"/>
  <text class="lbl halo" x="605" y="661" text-anchor="middle">GET /instances/{id}/bearer</text>
  <circle class="cn" cx="512" cy="676" r="10"/><text class="cnt" x="512" y="680" text-anchor="middle">16</text>
  <line class="e dashed" x1="700" y1="708" x2="492" y2="708" marker-end="url(#ah)"/>
  <text class="lbl halo" x="585" y="693" text-anchor="middle">MI token · monitor.azure.com</text>
  <circle class="cn" cx="678" cy="708" r="10"/><text class="cnt" x="678" y="712" text-anchor="middle">17</text>
  <line class="e dashed" x1="490" y1="740" x2="292" y2="740" marker-end="url(#ah)"/>
  <text class="lbl halo" x="380" y="725" text-anchor="middle">Authorization header</text>
  <circle class="cn" cx="468" cy="740" r="10"/><text class="cnt" x="468" y="744" text-anchor="middle">18</text>
  <line class="e" x1="290" y1="790" x2="903" y2="790" marker-end="url(#ah)"/>
  <text class="lbl halo" x="608" y="775" text-anchor="middle">OTLP log events + MI token</text>
  <circle class="cn" cx="312" cy="790" r="10"/><text class="cnt" x="312" y="794" text-anchor="middle">19</text>
</svg>
