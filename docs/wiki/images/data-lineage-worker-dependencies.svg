<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d">
  <title id="t">Every worker runs on its own cron and nothing orders them; usage-reconciliation converges on four upstream tables whenever it next runs.</title>
  <desc id="d">Data dependencies between scheduled workers. On the left, analytics-poll, reconciliation-sync, azure-monitor-read and copilot-pool-bill write actual_spend, pending_placement, reconciliation_record, attribution_record and copilot_pool_bill with its allocation. placement-sync moves pending_placement rows into actual_spend. provider-transform derives provider_usage_fact from actual_spend and reconciliation_record. usage-reconciliation reads actual_spend and reconciliation_record through v_teammate_usage_daily, corroborated attribution_record and provider_usage_fact, and writes unaccounted_usage with its per-model children in one transaction, and over_emission. aggregate-rollup materialises rollups from attribution_record. Arrows are data dependencies, not execution order.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="590"/>
  <rect class="zone" x="16" y="16" width="220" height="556" rx="10"/>
  <text class="zlabel" x="30" y="38">WORKERS THAT WRITE</text>
  <rect class="zone" x="256" y="16" width="240" height="556" rx="10"/>
  <text class="zlabel" x="270" y="38">TABLES</text>
  <rect class="zone" x="536" y="16" width="220" height="556" rx="10"/>
  <text class="zlabel" x="550" y="38">WORKERS THAT DERIVE</text>
  <rect class="zone" x="776" y="16" width="208" height="556" rx="10"/>
  <text class="zlabel" x="790" y="38">DERIVED</text>

  <!-- column A -->
  <rect class="node" x="32" y="92" width="188" height="56" rx="6"/>
  <text class="tm" x="126" y="114" text-anchor="middle">analytics-poll</text>
  <text class="sm" x="126" y="134" text-anchor="middle">*/15 * * * *</text>
  <rect class="node" x="32" y="246" width="188" height="64" rx="6"/>
  <text class="tm" x="126" y="266" text-anchor="middle">reconciliation-sync</text>
  <text class="sm" x="126" y="284" text-anchor="middle">0 */1 * * *</text>
  <text class="s" x="126" y="301" text-anchor="middle">runs the copilot-bill writer</text>
  <rect class="node" x="32" y="384" width="188" height="66" rx="6"/>
  <text class="tm" x="126" y="410" text-anchor="middle">azure-monitor-read</text>
  <text class="sm" x="126" y="430" text-anchor="middle">*/5 * * * *</text>
  <rect class="node" x="32" y="490" width="188" height="56" rx="6"/>
  <text class="tm" x="126" y="512" text-anchor="middle">copilot-pool-bill</text>
  <text class="sm" x="126" y="532" text-anchor="middle">0 5 * * *</text>

  <!-- column B -->
  <rect class="node" x="272" y="60" width="208" height="40" rx="6"/>
  <text class="tm" x="376" y="78" text-anchor="middle">pending_placement</text>
  <text class="s" x="376" y="93" text-anchor="middle">bills for unbound emails</text>
  <rect class="node" x="272" y="150" width="208" height="56" rx="6"/>
  <text class="tm" x="376" y="172" text-anchor="middle">actual_spend</text>
  <text class="s" x="376" y="191" text-anchor="middle">per teammate · day · tool</text>
  <rect class="node" x="272" y="250" width="208" height="56" rx="6"/>
  <text class="tm" x="376" y="272" text-anchor="middle">reconciliation_record</text>
  <text class="s" x="376" y="291" text-anchor="middle">Copilot per user · day · raw</text>
  <rect class="node" x="272" y="384" width="208" height="66" rx="6"/>
  <text class="tm" x="376" y="410" text-anchor="middle">attribution_record</text>
  <text class="s" x="376" y="429" text-anchor="middle">per OTel event · token type</text>
  <rect class="node env" x="272" y="482" width="208" height="72" rx="8"/>
  <text class="tm" x="376" y="502" text-anchor="middle">copilot_pool_bill</text>
  <text class="sm" x="376" y="520" text-anchor="middle">+ copilot_overage_allocation</text>
  <text class="s" x="376" y="540" text-anchor="middle">one transaction</text>

  <!-- column C -->
  <rect class="node" x="552" y="58" width="188" height="56" rx="6"/>
  <text class="tm" x="646" y="80" text-anchor="middle">placement-sync</text>
  <text class="sm" x="646" y="100" text-anchor="middle">*/30 * * * *</text>
  <rect class="node" x="552" y="192" width="188" height="56" rx="6"/>
  <text class="tm" x="646" y="214" text-anchor="middle">provider-transform</text>
  <text class="sm" x="646" y="234" text-anchor="middle">0 * * * * · 30-day window</text>
  <rect class="node acc" x="552" y="306" width="188" height="76" rx="6"/>
  <text class="tm" x="646" y="328" text-anchor="middle">usage-reconciliation</text>
  <text class="sm acc" x="646" y="348" text-anchor="middle">0 */2 * * *</text>
  <text class="s acc" x="646" y="366" text-anchor="middle">35-day window</text>
  <rect class="node" x="552" y="416" width="188" height="56" rx="6"/>
  <text class="tm" x="646" y="438" text-anchor="middle">aggregate-rollup</text>
  <text class="sm" x="646" y="458" text-anchor="middle">*/15 * * * *</text>

  <!-- column D -->
  <rect class="node" x="792" y="192" width="176" height="56" rx="6"/>
  <text class="tm" x="880" y="214" text-anchor="middle">provider_usage_fact</text>
  <text class="s" x="880" y="233" text-anchor="middle">model split · API lane</text>
  <rect class="node env" x="792" y="298" width="176" height="64" rx="8"/>
  <text class="tm" x="880" y="317" text-anchor="middle">unaccounted_usage</text>
  <text class="tm" x="880" y="335" text-anchor="middle">+ _model children</text>
  <text class="s" x="880" y="355" text-anchor="middle">one transaction</text>
  <rect class="node" x="792" y="370" width="176" height="34" rx="6"/>
  <text class="tm" x="880" y="392" text-anchor="middle">over_emission</text>
  <rect class="node" x="792" y="416" width="176" height="56" rx="6"/>
  <text class="tm" x="880" y="438" text-anchor="middle">attribution_aggregate</text>
  <text class="s" x="880" y="457" text-anchor="middle">+ two daily rollups</text>

  <!-- A to B -->
  <polyline class="e" points="220,108 244,108 244,80 266,80" marker-end="url(#ah)"/>
  <polyline class="e" points="220,132 244,132 244,170 266,170" marker-end="url(#ah)"/>
  <line class="e" x1="220" y1="282" x2="266" y2="282" marker-end="url(#ah)"/>
  <polyline class="e" points="220,262 252,262 252,194 266,194" marker-end="url(#ah)"/>
  <line class="e" x1="220" y1="417" x2="266" y2="417" marker-end="url(#ah)"/>
  <line class="e" x1="220" y1="518" x2="266" y2="518" marker-end="url(#ah)"/>
  <circle class="cn" cx="243" cy="535" r="9"/><text class="cnt" x="243" y="539" text-anchor="middle">5</text>

  <!-- 1 placement replay -->
  <line class="e" x1="480" y1="80" x2="546" y2="80" marker-end="url(#ah)"/>
  <polyline class="e" points="552,100 512,100 512,164 486,164" marker-end="url(#ah)"/>
  <circle class="cn" cx="512" cy="132" r="10"/><text class="cnt" x="512" y="136" text-anchor="middle">1</text>

  <!-- 2 bus: actual_spend + reconciliation_record -->
  <polyline class="e" points="480,190 522,190 522,346 546,346" marker-end="url(#ah)"/>
  <line class="e" x1="480" y1="278" x2="522" y2="278"/>
  <line class="e" x1="522" y1="220" x2="546" y2="220" marker-end="url(#ah)"/>
  <circle class="cn" cx="522" cy="248" r="10"/><text class="cnt" x="522" y="252" text-anchor="middle">2</text>

  <!-- attribution_record to UR and rollup -->
  <polyline class="e" points="480,396 532,396 532,366 546,366" marker-end="url(#ah)"/>
  <line class="e" x1="480" y1="440" x2="546" y2="440" marker-end="url(#ah)"/>

  <!-- C to D -->
  <line class="e" x1="740" y1="220" x2="786" y2="220" marker-end="url(#ah)"/>
  <polyline class="e" points="792,236 766,236 766,318 746,318" marker-end="url(#ah)"/>
  <circle class="cn" cx="766" cy="277" r="10"/><text class="cnt" x="766" y="281" text-anchor="middle">3</text>
  <line class="e" x1="740" y1="338" x2="786" y2="338" marker-end="url(#ah)"/>
  <circle class="cn" cx="766" cy="340" r="9"/><text class="cnt" x="766" y="344" text-anchor="middle">4</text>
  <polyline class="e" points="740,372 770,372 770,387 786,387" marker-end="url(#ah)"/>
  <line class="e" x1="740" y1="444" x2="786" y2="444" marker-end="url(#ah)"/>
</svg>
