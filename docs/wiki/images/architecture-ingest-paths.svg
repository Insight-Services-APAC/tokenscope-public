  <polyline class="e" points="424,292 462,292" marker-end="url(#ah)"/>
  <circle class="cn" cx="443" cy="292" r="10"/><text class="cnt" x="443" y="296" text-anchor="middle">3</text>
  <polyline class="e" points="424,374 462,374" marker-end="url(#ah)"/>
  <circle class="cn" cx="443" cy="374" r="10"/><text class="cnt" x="443" y="378" text-anchor="middle">4</text>
  <polyline class="e" points="424,484 462,484" marker-end="url(#ah)"/>
  <circle class="cn" cx="443" cy="484" r="10"/><text class="cnt" x="443" y="488" text-anchor="middle">5</text>
  <polyline class="e" points="424,558 462,558" marker-end="url(#ah)"/>
  <circle class="cn" cx="443" cy="558" r="10"/><text class="cnt" x="443" y="562" text-anchor="middle">6</text>
  <polyline class="e dashed" points="424,272 452,272 452,200 462,200" marker-end="url(#ah)"/>
  <rect class="node" x="708" y="56" width="264" height="168" rx="6"/>
  <text class="t" x="722" y="93.5">§A attributed</text>
  <text class="sm" x="722" y="110.5">v_complete_usage</text>
  <text class="s" x="722" y="127.5">attribution_record (OTel detail)</text>
  <text class="s" x="722" y="144.5">+ unaccounted_usage (API minus OTel)</text>
  <text class="s" x="722" y="161.5">+ ingest-only tools, which never emit,</text>
  <text class="s" x="722" y="178.5">from actual_spend · reconciliation_record</text>
  <text class="s" x="722" y="195.5">model split: provider_usage_fact</text>
  <rect class="node acc" x="708" y="300" width="264" height="168" rx="6"/>
