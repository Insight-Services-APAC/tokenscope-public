  <rect class="node" x="28" y="56" width="156" height="56" rx="6"/>
  <text class="tm" x="106" y="80" text-anchor="middle">OTelLogs</text>
  <text class="s" x="106" y="97" text-anchor="middle">device OTLP log events</text>
  <rect class="node" x="28" y="160" width="156" height="56" rx="6"/>
  <text class="t" x="106" y="184" text-anchor="middle">Anthropic</text>
  <text class="s" x="106" y="201" text-anchor="middle">Analytics API · day grain</text>
  <rect class="node" x="28" y="264" width="156" height="138" rx="6"/>
  <text class="t" x="106" y="320.5" text-anchor="middle">GitHub</text>
