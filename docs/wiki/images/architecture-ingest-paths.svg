  <text class="tm" x="326" y="288" text-anchor="middle">reconciliation-sync</text>
  <text class="s" x="326" y="305" text-anchor="middle">hourly</text>
  <rect class="node" x="468" y="264" width="196" height="56" rx="6"/>
  <text class="tm" x="566" y="288" text-anchor="middle">reconciliation_record</text>
  <text class="s" x="566" y="305" text-anchor="middle">teammate · day · category</text>
  <rect class="node inner" x="228" y="346" width="196" height="56" rx="6"/>
  <text class="tm" x="326" y="370" text-anchor="middle">copilot-pool-bill</text>
  <text class="s" x="326" y="387" text-anchor="middle">daily</text>
  <rect class="node" x="468" y="346" width="196" height="56" rx="6"/>
  <text class="tm" x="566" y="370" text-anchor="middle">copilot_pool_bill</text>
  <text class="s" x="566" y="387" text-anchor="middle">org · month</text>
  <text class="zlabel" x="228" y="440">DERIVED FROM THE TABLES</text>
  <rect class="node inner" x="228" y="452" width="196" height="64" rx="6"/>
  <text class="tm" x="326" y="471.5" text-anchor="middle">provider-transform</text>
  <text class="s" x="326" y="488.5" text-anchor="middle">hourly · reads actual_spend</text>
  <text class="s" x="326" y="505.5" text-anchor="middle">and reconciliation_record</text>
