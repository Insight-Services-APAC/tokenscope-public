<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 680" width="1010" height="680" role="img" aria-labelledby="t d">
  <title id="t">The OIDC cookie is the only identity cookie; every request re-reads the teammate, so revocation and deactivation apply on the next request.</title>
  <desc id="d">Lifelines for Browser, nuxt-oidc-auth, Entra ID, tryAuth and PostgreSQL. Sign-in: the browser starts sign-in, nuxt-oidc-auth runs the Entra authorization with openid, profile, email and offline_access, receives tokens with oid, email, name and UPN claims, and sets an encrypted session cookie. On every request tryAuth decrypts the cookie, looks up the teammate by Entra object id, creates or adopts the row on first sign-in, checks is_active and revoked_at, and returns a frozen session cached for the request, or the request gets 401.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #ffffff; --fg: #1b2230; --fg2: #4d586b; --line: #c9d0db; --zone: #f3f5f8;
      --accent: #2554c7; --accent-soft: #e4ebfb; --blocked: #c0392b; --ok: #1e7f4f; --private: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --fg: #e3e8f0; --fg2: #a3aec0; --line: #3a4453; --zone: #11161d;
        --accent: #7aa2ff; --accent-soft: #1d2a47; --blocked: #ff7a6b; --ok: #4fd18f; --private: #e2b04a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--line); }
    .zlabel { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; fill: var(--fg2); }
    .node { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .node.inner { stroke: var(--line); }
    .node.env { fill: none; stroke: var(--fg2); stroke-dasharray: 4 3; }
    .node.private { stroke: var(--private); stroke-width: 1.6; }
    .node.acc { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .node.ghost { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
    .node.bad { stroke: var(--blocked); stroke-width: 1.6; }
    .node.good { stroke: var(--ok); stroke-width: 1.6; }
    .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .tm { fill: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .s { fill: var(--fg2); font-size: 11.5px; }
    .sm { fill: var(--fg2); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .s.bad, .sm.bad { fill: var(--blocked); }
    .s.ok, .sm.ok { fill: var(--ok); }
    .s.acc, .sm.acc { fill: var(--accent); }
    .s.priv, .sm.priv { fill: var(--private); }
    .s.ghost { font-style: italic; }
    .lbl { fill: var(--fg2); font-size: 11px; }
    .e { fill: none; stroke: var(--fg2); stroke-width: 1.6; }
    .e.dashed { stroke-dasharray: 5 4; }
    .e.accent { stroke: var(--accent); stroke-width: 2.6; }
    .e.bad { stroke: var(--blocked); stroke-width: 2; stroke-dasharray: 6 4; }
    .e.ok { stroke: var(--ok); stroke-width: 2.4; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: var(--zone); stroke: var(--fg2); stroke-width: 1; }
    .ah { fill: var(--fg2); }
    .ah.accent { fill: var(--accent); }
    .ah.bad { fill: var(--blocked); }
    .ah.ok { fill: var(--ok); }
    .cn { fill: var(--panel); stroke: var(--fg2); stroke-width: 1.2; }
    .cn.accent { fill: var(--accent); stroke: var(--accent); }
    .cn.bad { stroke: var(--blocked); }
    .cnt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--fg); }
    .cnt.accent { fill: var(--panel); }
    .cnt.bad { fill: var(--blocked); }
    .x { stroke: var(--blocked); stroke-width: 3; stroke-linecap: round; }
    .fr { fill: var(--panel); stroke: var(--fg2); stroke-width: 1; stroke-dasharray: 3 3; }
    .frl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .06em; fill: var(--fg2); }
    .band { stroke: var(--line); stroke-width: 1; }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah accent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1010" height="680"/>
  <!-- participants -->
  <rect class="node" x="20" y="20" width="140" height="44" rx="6"/>
  <text class="t" x="90" y="47" text-anchor="middle">Browser</text>
  <rect class="node" x="190" y="20" width="160" height="44" rx="6"/>
  <text class="t" x="270" y="39" text-anchor="middle">nuxt-oidc-auth</text>
  <text class="sm" x="270" y="55" text-anchor="middle">/auth/entra/*</text>
  <rect class="node" x="380" y="20" width="140" height="44" rx="6"/>
  <text class="t" x="450" y="47" text-anchor="middle">Entra ID</text>
  <rect class="node" x="560" y="20" width="160" height="44" rx="6"/>
  <text class="t" x="640" y="39" text-anchor="middle">tryAuth</text>
  <text class="s" x="640" y="55" text-anchor="middle">server/utils/auth.ts</text>
  <rect class="node private" x="790" y="20" width="140" height="44" rx="6"/>
  <text class="t" x="860" y="47" text-anchor="middle">PostgreSQL</text>

  <line class="life" x1="90" y1="64" x2="90" y2="660"/>
  <line class="life" x1="270" y1="64" x2="270" y2="660"/>
  <line class="life" x1="450" y1="64" x2="450" y2="660"/>
  <line class="life" x1="640" y1="64" x2="640" y2="660"/>
  <line class="life" x1="860" y1="64" x2="860" y2="316"/>
  <line class="life" x1="860" y1="354" x2="860" y2="404"/>
  <line class="life" x1="860" y1="542" x2="860" y2="560"/>
  <line class="life" x1="860" y1="598" x2="860" y2="660"/>

  <text class="zlabel" x="20" y="86">SIGN-IN</text>
  <!-- 1 -->
  <line class="e" x1="90" y1="106" x2="268" y2="106" marker-end="url(#ah)"/>
  <circle class="cn" cx="110" cy="106" r="10"/><text class="cnt" x="110" y="110" text-anchor="middle">1</text>
  <text class="lbl" x="190" y="99" text-anchor="middle">sign in</text>
  <!-- 2 -->
  <line class="e" x1="270" y1="144" x2="448" y2="144" marker-end="url(#ah)"/>
  <circle class="cn" cx="290" cy="144" r="10"/><text class="cnt" x="290" y="148" text-anchor="middle">2</text>
  <text class="sm" x="370" y="130" text-anchor="middle">openid profile email offline_access</text>
  <!-- 3 -->
  <line class="e dashed" x1="450" y1="182" x2="272" y2="182" marker-end="url(#ah)"/>
  <circle class="cn" cx="430" cy="182" r="10"/><text class="cnt" x="430" y="186" text-anchor="middle">3</text>
  <text class="lbl" x="350" y="168" text-anchor="middle">tokens · oid, email, name, UPN</text>
  <!-- 4 -->
  <line class="e dashed" x1="270" y1="220" x2="92" y2="220" marker-end="url(#ah)"/>
  <circle class="cn" cx="250" cy="220" r="10"/><text class="cnt" x="250" y="224" text-anchor="middle">4</text>
  <text class="lbl" x="165" y="206" text-anchor="middle">encrypted session cookie</text>

  <line class="band" x1="20" y1="250" x2="990" y2="250"/>
  <text class="zlabel" x="20" y="270">EVERY REQUEST</text>

  <rect class="act" x="634" y="288" width="12" height="356"/>
  <!-- 5 -->
  <line class="e" x1="90" y1="294" x2="632" y2="294" marker-end="url(#ah)"/>
  <circle class="cn" cx="110" cy="294" r="10"/><text class="cnt" x="110" y="298" text-anchor="middle">5</text>
  <text class="lbl" x="360" y="287" text-anchor="middle">request + session cookie</text>
  <!-- 6 self -->
  <polyline class="e" points="646,324 690,324 690,346 648,346" marker-end="url(#ah)"/>
  <circle class="cn" cx="690" cy="335" r="10"/><text class="cnt" x="690" y="339" text-anchor="middle">6</text>
  <text class="lbl" x="708" y="332">decrypt cookie, read claims</text>
  <text class="lbl" x="708" y="346">no oid or email: no session</text>
  <!-- 7 accent -->
  <line class="e accent" x1="646" y1="384" x2="856" y2="384" marker-end="url(#ah-acc)"/>
  <circle class="cn accent" cx="666" cy="384" r="10"/><text class="cnt accent" x="666" y="388" text-anchor="middle">7</text>
  <text class="s acc" x="760" y="377" text-anchor="middle">teammate by entra_oid</text>

  <!-- alt: first sign-in -->
  <rect class="fr" x="600" y="404" width="390" height="138" rx="6"/>
  <text class="frl" x="610" y="420">FIRST SIGN-IN ONLY</text>
  <rect class="act" x="634" y="426" width="12" height="116"/>
  <line class="life" x1="860" y1="426" x2="860" y2="446"/>
  <line class="e" x1="646" y1="442" x2="856" y2="442" marker-end="url(#ah)"/>
  <circle class="cn" cx="666" cy="442" r="10"/><text class="cnt" x="666" y="446" text-anchor="middle">8</text>
  <text class="lbl" x="770" y="436" text-anchor="middle">create or adopt</text>
  <text class="s" x="658" y="464">UPN on the exclusion list: 403, no teammate</text>
  <text class="s" x="658" y="480">adopt a bill-provisioned row with that email</text>
  <text class="sm" x="658" y="496">else INSERT … ON CONFLICT (entra_oid) DO NOTHING</text>
  <text class="s" x="658" y="512">platform-admin for the bootstrap email, else developer</text>
  <text class="s" x="658" y="528">home: first region's __UNPLACED__ unit · audit row</text>

  <!-- 9 self accent -->
  <polyline class="e accent" points="646,566 690,566 690,592 648,592" marker-end="url(#ah-acc)"/>
  <circle class="cn accent" cx="690" cy="579" r="10"/><text class="cnt accent" x="690" y="583" text-anchor="middle">9</text>
  <text class="s acc" x="708" y="575">is_active is true, and the cookie's</text>
  <text class="s acc" x="708" y="590">login time is not before revoked_at</text>
  <!-- 10 -->
  <line class="e dashed" x1="634" y1="626" x2="92" y2="626" marker-end="url(#ah)"/>
  <circle class="cn" cx="614" cy="626" r="10"/><text class="cnt" x="614" y="630" text-anchor="middle">10</text>
  <text class="lbl" x="360" y="619" text-anchor="middle">frozen Session, cached on the request · or 401</text>
</svg>
