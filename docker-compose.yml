# TokenScope local dev stack. The Nuxt app runs on the host (`npm run dev`,
# :3450); these services back it. Every port is bound to 127.0.0.1 only, and
# each host port is overridable for machines where the default is taken.
#
#   postgres                 127.0.0.1:${TS_PG_PORT:-5432}
#   redis                    127.0.0.1:${TS_REDIS_PORT:-6379}
#   azurite (blob)           127.0.0.1:${TS_AZURITE_PORT:-10000}
#   fake-azure-monitor       127.0.0.1:${TS_AZMON_PORT:-4318}   (OTLP /v1/logs + reader API)
#   synthetic-anthropic-api  127.0.0.1:${TS_ANTHROPIC_PORT:-8090}
#   otel-collector           not published (raw OTLP debug sink, see RUN-LOCALLY.md)
#
# Inside a cw container, scripts/dev-stack.sh layers docker-compose.cw.yml on
# top: no published ports, services joined to the cw network by container name.

name: tokenscope

services:
  postgres:
    image: postgres:16
    container_name: ${CW_WORKER_NAME:-tokenscope}-postgres
    ports: ['127.0.0.1:${TS_PG_PORT:-5432}:5432']
    environment:
      POSTGRES_USER: tokenscope
      POSTGRES_PASSWORD: tokenscope
      POSTGRES_DB: tokenscope
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tokenscope -d tokenscope']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ${CW_WORKER_NAME:-tokenscope}-redis
    ports: ['127.0.0.1:${TS_REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: ${CW_WORKER_NAME:-tokenscope}-azurite
    ports: ['127.0.0.1:${TS_AZURITE_PORT:-10000}:10000']
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --skipApiVersionCheck

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ${CW_WORKER_NAME:-tokenscope}-otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    # The image runs as a non-root user, and Docker creates the otel-data
    # volume root-owned, so the file exporter cannot open its file and the
    # collector exits. Local dev stack only.
    user: '0:0'
    configs:
      - source: otel_config
        target: /etc/otel-collector-config.yaml
    volumes:
      - otel-data:/var/lib/otel

  fake-azure-monitor:
    build:
      context: ./tools/fake-azure-monitor
    container_name: ${CW_WORKER_NAME:-tokenscope}-fake-azure-monitor
    ports: ['127.0.0.1:${TS_AZMON_PORT:-4318}:8080']
    environment:
      PORT: '8080'
    depends_on:
      - otel-collector

  synthetic-anthropic-api:
    build:
      context: ./tools/synthetic-anthropic-api
    container_name: ${CW_WORKER_NAME:-tokenscope}-synthetic-anthropic-api
    ports: ['127.0.0.1:${TS_ANTHROPIC_PORT:-8090}:8080']
    environment:
      PORT: '8080'

volumes:
  otel-data:

# Inline configs keep sibling containers free of bind mounts (which would
# need host-side paths to work via the cw worker's docker socket).
configs:
  otel_config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
          timeout: 5s
          send_batch_size: 1024
      exporters:
        debug:
          verbosity: basic
        file:
          path: /var/lib/otel/telemetry.jsonl
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, file]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, file]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, file]
